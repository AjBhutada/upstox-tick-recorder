name: record-ticks
on:
  schedule:
    - cron: "15 3 * * 1-5"   # 08:45 IST -> part A, records till 12:30 IST
    - cron: "0 6 * * 1-5"    # 11:30 IST -> part B, records till 15:31 IST (overlap is deliberate)
  workflow_dispatch:
    inputs:
      stop: {description: "stop time HH:MM IST", default: "15:31"}
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q upstox-python-sdk
      - name: Record
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          H=$(TZ=Asia/Kolkata date +%H)
          if [ -n "${{ github.event.inputs.stop }}" ]; then STOP="${{ github.event.inputs.stop }}"; PART=manual$(date +%s)
          elif [ "$H" -lt 11 ]; then STOP=12:30; PART=a; else STOP=15:31; PART=b; fi
          echo "DAY=$(TZ=Asia/Kolkata date +%Y%m%d)" >> $GITHUB_ENV
          echo "PART=$PART" >> $GITHUB_ENV
          python cloud_recorder.py ticks.jsonl "$STOP"
      - name: Compress, encrypt, upload
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TICKS_KEY: ${{ secrets.TICKS_KEY }}
        run: |
          [ -s ticks.jsonl ] || { echo "no data"; exit 1; }
          tar czf - ticks.jsonl ticks_instruments.json | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:TICKS_KEY -out "${DAY}_${PART}.tgz.enc"
          ls -l *.enc
          gh release view "$DAY" >/dev/null 2>&1 || gh release create "$DAY" --title "$DAY" --notes "encrypted tick data" || true
          gh release upload "$DAY" "${DAY}_${PART}.tgz.enc" --clobber
