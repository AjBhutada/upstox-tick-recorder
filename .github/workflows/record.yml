name: record-ticks
on:
  # Started ONLY by cron-job.org (workflow_dispatch): part A at 08:40 IST (records 09:00 pre-open to 12:30), part B late
  # morning (to 15:46). GitHub's own timers were removed on 24 Nov 2026: in this repo they fired hours late (11:17 at 21:59,
  # 08:37 at 00:10) and one took the day's slot so the real 08:40 start skipped. A start outside 08:00-15:30 IST does nothing.
  workflow_dispatch:
    inputs:
      stop: {description: "stop time HH:MM IST (leave empty = normal part A/B by time of day)", default: "", required: false}
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q "upstox-python-sdk>=2.31"   # 2.31+ decodes the auction fields (iep = indicative price in the 09:00-09:08 pre-open)
      - name: Record
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          M=$((10#$(TZ=Asia/Kolkata date +%H%M)))
          if [ -n "${{ github.event.inputs.stop }}" ]; then STOP="${{ github.event.inputs.stop }}"; PART=manual$(date +%s)
          elif [ "$M" -ge 800 ] && [ "$M" -lt 1100 ]; then STOP=12:30; PART=a
          elif [ "$M" -ge 1100 ] && [ "$M" -lt 1530 ]; then STOP=15:46; PART=b
          else
            # GitHub sometimes fires a timer hours late (e.g. 00:10 IST). Such a run must not take the day's slot,
            # or the real 08:40 start skips and the 09:00 pre-open is not recorded.
            echo "started at $M IST, outside market hours - nothing to record"; echo "SKIP=1" >> $GITHUB_ENV; exit 0
          fi
          DAY=$(TZ=Asia/Kolkata date +%Y%m%d)
          echo "DAY=$DAY" >> $GITHUB_ENV
          echo "PART=$PART" >> $GITHUB_ENV
          gh release view "$DAY" >/dev/null 2>&1 || gh release create "$DAY" --title "$DAY" --notes "encrypted tick data" || true
          if gh release view "$DAY" --json assets -q '.assets[].name' | grep -qx "${DAY}_${PART}.lock"; then
            echo "part $PART already running/recorded today - skipping"; echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          echo started > "${DAY}_${PART}.lock"; gh release upload "$DAY" "${DAY}_${PART}.lock"
          python cloud_recorder.py ticks.jsonl "$STOP"
      - name: Compress, encrypt, upload
        if: always() && env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TICKS_KEY: ${{ secrets.TICKS_KEY }}
        run: |
          [ -s ticks.jsonl ] || { echo "no data"; exit 1; }
          tar czf - ticks.jsonl ticks_instruments.json | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:TICKS_KEY -out "${DAY}_${PART}.tgz.enc"
          ls -l *.enc
          gh release view "$DAY" >/dev/null 2>&1 || gh release create "$DAY" --title "$DAY" --notes "encrypted tick data" || true
          gh release upload "$DAY" "${DAY}_${PART}.tgz.enc" --clobber
